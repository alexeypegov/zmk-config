# nice!view: custom status screen from nice-view-gem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Deep sleep after 10 min of inactivity (wake with a keypress)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Radio TX power: default is 0 dBm, which is plenty within ~1 m of the host.
# Raise (e.g. CONFIG_BT_CTLR_TX_PWR_PLUS_4=y) if you see dropouts,
# or lower (CONFIG_BT_CTLR_TX_PWR_MINUS_4=y) to save a bit more.

# Report the right half's battery level to the host too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse keys for the Mouse layer
CONFIG_ZMK_POINTING=y

# Uncomment to enable USB logging (significantly increases power usage)
# CONFIG_ZMK_USB_LOGGING=y
