# nice!view: custom status screen from nice-view-gem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Still gem on the right half instead of the animation
CONFIG_NICE_VIEW_GEM_ANIMATION=n
# Which still frame to show: 1-16 picks a fixed frame, 0 = random per boot
CONFIG_NICE_VIEW_GEM_ANIMATION_FRAME=4

# Deep sleep after 10 min of inactivity (wake with a keypress)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Disable 2M PHY: the host links kept dropping with reason 0x24
# (LMP/LL PDU not allowed), which causes stuck/repeating keys.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Radio TX power +4 dBm (the default is 0). At 0 dBm the links kept dropping
# (host 0x24, split 0x08/0x3e); testing whether more power fixes it.
# Next step up if drops continue: CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Report the right half's battery level to the host too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse keys for the Mouse layer
CONFIG_ZMK_POINTING=y

# Uncomment to enable USB logging (significantly increases power usage)
# CONFIG_ZMK_USB_LOGGING=y
